[package]
name = "slip39-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
slip39-core = { path = ".." }

[[bin]]
name = "decode_raw"
path = "fuzz_targets/decode_raw.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_words"
path = "fuzz_targets/decode_words.rs"
test = false
doc = false
bench = false

[[bin]]
name = "combine"
path = "fuzz_targets/combine.rs"
test = false
doc = false
bench = false
