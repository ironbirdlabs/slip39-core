name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly fuzz run, Mondays 03:00 UTC

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --no-default-features
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The fuzz crate's lockfile records this crate's version and dependencies, so it goes
      # stale whenever either changes; see CONTRIBUTING.md for the command that refreshes it.
      - name: Check that fuzz/Cargo.lock is current
        run: cargo metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install shamir-mnemonic==0.3.0
      - run: tests/interop/run.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.87
        with:
          toolchain: "1.87"
      - run: cargo check --all-targets

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # nightly
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      # Random bytes do not get past the word list and the checksum, so decode_raw starts
      # from real mnemonics: one corpus file for each mnemonic in the reference vectors.
      - name: Seed the decode_raw corpus
        run: |
          mkdir -p fuzz/corpus/decode_raw
          jq -r '.[][1][]' tests/vectors.json | split -a 3 -l 1 - fuzz/corpus/decode_raw/vector-
      - run: |
          for target in decode_raw decode_words combine; do
            cargo fuzz run "$target" -- -max_total_time=600
          done
