[package]
name = "slip39-core"
version = "0.1.1"
edition = "2021"
rust-version = "1.87"
authors = ["Ironbird Labs, LLC"]
description = "A minimal implementation of SLIP-39, Shamir's Secret Sharing for mnemonic codes"
license = "Apache-2.0"
repository = "https://github.com/ironbirdlabs/slip39-core"
documentation = "https://docs.rs/slip39-core"
readme = "README.md"
keywords = ["slip39", "shamir", "mnemonic", "secret-sharing", "backup"]
categories = ["cryptography"]
exclude = [".github/"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["getrandom"]
# Randomness from the operating system via `OsRandom` and `generate_mnemonics`.
getrandom = ["dep:getrandom"]

[dependencies]
getrandom = { version = "0.3", optional = true }
hmac = "0.12"
pbkdf2 = "0.12"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
hex = "0.4"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
